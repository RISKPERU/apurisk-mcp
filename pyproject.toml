[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apurisk-mcp"
version = "0.2.0"
description = "Servidor MCP para controlar el add-in ApuRisk dentro de Excel desde Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apurisk-mcp = "apurisk_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
